<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tadoniji</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    #typed-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      font-family: "Courier New", monospace;
      font-size: 12vw;
      color: rgba(0, 255, 100, 0.05);
      white-space: pre-wrap;
      pointer-events: none;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 0.9;
      filter: blur(1px) contrast(1.2);
      animation: jitter 0.15s infinite alternate;
    }

    @keyframes jitter {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-1px, 1px); }
      50% { transform: translate(1px, -1px); }
      75% { transform: translate(-1px, 1px); }
      100% { transform: translate(0, 0); }
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.05),
        rgba(0,0,0,0.05) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 0;
    }

    #home, .page {
      max-width: 700px;
      position: relative;
      z-index: 2; 
    }

    .hidden { display: none; }

    h1, h2 {
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 1.5rem;
    }

    li { margin: 0.4rem 0; opacity: 0.9; }

    .hint { margin-top: 1.5rem; font-size: 0.9em; color: #666; }
  </style>
</head>
<body>

<div id="typed-background"></div>

<div id="home">
  <h1>Tadoniji</h1>
  <p class="hint">Recherchez un titre dans la discographie.</p>
</div>

<div id="catalogue" class="page hidden">
  <h2>Catalogue</h2>
  <ul id="catalogue-list"></ul>
</div>

<div id="albums" class="page hidden">
  <h2>Albums</h2>
  <ul id="albums-list"></ul>
</div>

<div id="singles" class="page hidden">
  <h2>Singles</h2>
  <ul id="singles-list"></ul>
</div>

<div id="ep" class="page hidden">
  <h2>EP</h2>
  <ul id="ep-list"></ul>
</div>

<script>
let typed = "";
const typedBg = document.getElementById("typed-background");

function updateTypedBg() {
  typedBg.textContent = typed.toUpperCase();
}

// Pages
const pages = {
  home: document.getElementById("home"),
  catalogue: document.getElementById("catalogue"),
  albums: document.getElementById("albums"),
  singles: document.getElementById("singles"),
  ep: document.getElementById("ep")
};

// Discographie 
const music = {
  albums: [
    { title: "Genesis", link: "https://playlist.link/genesis" },
    { title: "Paradox", link: "https://odesli.co/paradox" },
    { title: "Anachronos", link: "https://www.youtube.com/watch?v=da7f7q_r7Lg&list=OLAK5uy_mNIen8JKIT-Vgf9P0ovvfFVMjuvpRQeAM" },
    { title: "Timefall", link: "https://album.link/timefall" },
    { title: "Enemy", link: "https://www.youtube.com/watch?v=KulOsGd0k1E&list=OLAK5uy_l-03AeOkJ9PF9XZDzJVo2BONPz5WHhYGg" }
  ],
  singles: [
    { title: "Stand", link: "https://song.link/stand" },
    { title: "The Voices", link: "https://youtu.be/bpeY9Yof1lI" },
    { title: "Travel Spirit", link: "https://www.youtube.com/watch?v=r0TpHyHKxOs&list=OLAK5uy_nG4VKgFfc8YF4BbXzPLVpX5mpJZUld9E8" }
  ],
  ep: [] 
};

// listes
function populate() {
  const catalogue = [];
  music.albums.forEach(a => catalogue.push(a.title));
  music.singles.forEach(s => catalogue.push(s.title));

  document.getElementById("catalogue-list").innerHTML = catalogue.map(t => `<li>${t}</li>`).join("");
  document.getElementById("albums-list").innerHTML = music.albums.map(a => `<li>${a.title}</li>`).join("");
  document.getElementById("singles-list").innerHTML = music.singles.map(s => `<li>${s.title}</li>`).join("");
  document.getElementById("ep-list").innerHTML = "<li>—</li>";
}

populate();

function show(page) {
  Object.values(pages).forEach(p => p.classList.add("hidden"));
  pages[page].classList.remove("hidden");
}

function reset() {
  typed = "";
  show("home");
  updateTypedBg();
}

// tapage
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape") { reset(); return; }

  if(e.key.length === 1) {
    typed += e.key.toLowerCase();
    typed = typed.slice(-40);
    updateTypedBg();
  }

  // Esc
  Object.keys(pages).forEach(page => {
    if(typed.includes(page)) show(page);
  });

  // titres
  [...music.albums, ...music.singles].forEach(item => {
    if(typed.includes(item.title.toLowerCase())) {
      window.open(item.link, "_blank");
      typed = "";
      updateTypedBg();
    }
  });
});
</script>

</body>
</html>
