<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tadoniji</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    #typed-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      font-family: "Courier New", monospace;
      font-size: 12vw;
      color: rgba(0, 255, 100, 0.05);
      white-space: pre-wrap;
      pointer-events: none;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 0.9;
      filter: blur(1px) contrast(1.2);
      animation: jitter 0.15s infinite alternate;
    }

    @keyframes jitter {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-1px, 1px); }
      50% { transform: translate(1px, -1px); }
      75% { transform: translate(-1px, 1px); }
      100% { transform: translate(0, 0); }
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.05),
        rgba(0,0,0,0.05) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 0;
    }

    #home, .page {
      max-width: 700px;
      position: relative;
      z-index: 2; 
    }

    .hidden { display: none; }

    h1, h2 {
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 1.5rem;
    }

    li { margin: 0.4rem 0; opacity: 0.9; }

    .hint { margin-top: 1.5rem; font-size: 0.9em; color: #666; }
  </style>
</head>
<body>

<div id="hint-button" title="Voir un indice" style="
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 3;
  cursor: pointer;
  background: rgba(0,0,0,0.1);

  transition: 0.2s;
">Indice</div>

<div id="hint-list" class="hidden" style="
  position: fixed;
  top: 40px;
  right: 10px;
  background: rgba(255,255,255,0.9);
  padding: 8px 12px;
  border-radius: 6px;

  font-size: 0.85em;
  z-index: 3;
  max-width: 180px;
">
</div>

<div id="typed-background"></div>

<div id="home">
  <h1>Tadoniji</h1>
  <p class="hint">Recherchez un titre dans la discographie.</p><br>
  <p class="hint">ou tapez tadoniji pour vous laisser porter</p>
</div>

<div id="catalogue" class="page hidden">
  <h2>Catalogue</h2>
  <ul id="catalogue-list"></ul>
</div>

<div id="albums" class="page hidden">
  <h2>Albums</h2>
  <ul id="albums-list"></ul>
</div>

<div id="singles" class="page hidden">
  <h2>Singles</h2>
  <ul id="singles-list"></ul>
</div>

<div id="ep" class="page hidden">
  <h2>EP</h2>
  <ul id="ep-list"></ul>
</div>

<script>
let typed = "";
const typedBg = document.getElementById("typed-background");

// Pages
const pages = {
  home: document.getElementById("home"),
  catalogue: document.getElementById("catalogue"),
  albums: document.getElementById("albums"),
  singles: document.getElementById("singles"),
  ep: document.getElementById("ep")
};

// Discographie 
const music = {
  albums: [
    { title: "Genesis", link: "https://playlist.link/genesis" },
    { title: "Paradox", link: "https://odesli.co/paradox" },
    { title: "Anachronos", link: "https://www.youtube.com/watch?v=da7f7q_r7Lg&list=OLAK5uy_mNIen8JKIT-Vgf9P0ovvfFVMjuvpRQeAM" },
    { title: "Timefall", link: "https://album.link/timefall" },
    { title: "Enemy", link: "https://www.youtube.com/watch?v=KulOsGd0k1E&list=OLAK5uy_l-03AeOkJ9PF9XZDzJVo2BONPz5WHhYGg" }
  ],
  singles: [
    { title: "Stand", link: "https://song.link/stand" },
    { title: "The Voices", link: "https://youtu.be/bpeY9Yof1lI" },
    { title: "Travel Spirit", link: "https://www.youtube.com/watch?v=r0TpHyHKxOs&list=OLAK5uy_nG4VKgFfc8YF4BbXzPLVpX5mpJZUld9E8" }
  ],
  ep: [] 
};

// hints
const hintButton = document.getElementById("hint-button");
const hintList = document.getElementById("hint-list");
const mainTitles = [...music.albums.map(a => a.title), ...music.singles.map(s => s.title)];

// bouton indice
hintButton.addEventListener("click", () => {
  if(hintList.classList.contains("hidden")) {
    hintList.innerHTML = mainTitles.join("<br>");
    hintList.classList.remove("hidden");
  } else {
    hintList.classList.add("hidden");
  }
});

// popup GIF erreur
function triggerErrorPopup() {
  const popup = document.getElementById("error-popup");
  popup.classList.remove("hidden");
  setTimeout(() => popup.classList.add("hidden"), 1000);
}

// longueur maximale des titres pour délai erreur
const maxTitleLength = Math.max(...[...music.albums, ...music.singles].map(i => i.title.length));

// fonction pour mettre à jour le fond
function updateTypedBg() {
  typedBg.textContent = typed.toUpperCase();
}

// listes
function populate() {
  const catalogue = [];
  music.albums.forEach(a => catalogue.push(a.title));
  music.singles.forEach(s => catalogue.push(s.title));

  document.getElementById("catalogue-list").innerHTML = catalogue.map(t => `<li>${t}</li>`).join("");
  document.getElementById("albums-list").innerHTML = music.albums.map(a => `<li>${a.title}</li>`).join("");
  document.getElementById("singles-list").innerHTML = music.singles.map(s => `<li>${s.title}</li>`).join("");
  document.getElementById("ep-list").innerHTML = "<li>—</li>";
}
populate();

// fonctions pages
function show(page) {
  Object.values(pages).forEach(p => p.classList.add("hidden"));
  pages[page].classList.remove("hidden");
}

function reset() {
  typed = "";
  show("home");
  updateTypedBg();
}

// listener unique
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape") { reset(); return; }

  if(e.key.length === 1) {
    typed += e.key.toLowerCase();
    typed = typed.slice(-40);
    updateTypedBg();
  }

  // navigation pages
  Object.keys(pages).forEach(page => {
    if(typed.includes(page)) show(page);
  });

  // redirections titres
  [...music.albums, ...music.singles].forEach(item => {
    if(typed.includes(item.title.toLowerCase())){
      window.open(item.link, "_blank");
      typed = "";
      updateTypedBg();
    }
  });

  // Tadoniji → titre aléatoire
  if(typed.includes("tadoniji")){
    const randomIndex = Math.floor(Math.random() * mainTitles.length);
    const randomTitle = mainTitles[randomIndex];
    const item = [...music.albums, ...music.singles].find(i => i.title === randomTitle);
    if(item) window.open(item.link, "_blank");
    typed = "";
    updateTypedBg();
  }

  // popup erreur après maxTitleLength + 4 caractères si rien de valide
  const allTitles = [...music.albums, ...music.singles].map(i => i.title.toLowerCase());
  const validPages = Object.keys(pages);
  const isValid = allTitles.some(t => typed.includes(t)) || validPages.some(p => typed.includes(p)) || typed.includes("tadoniji");

  if(typed.length >= maxTitleLength + 4 && !isValid) {
    triggerErrorPopup();
  }
});
</script>



</body>
</html>
