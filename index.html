<!DOCTYPE html>
<html lang="fr">
<head>

  <style>
    body {
      margin: 0;

      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    body::after {
  content: "";
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 4;
  background: radial-gradient(circle, rgba(0,0,0,0) 70%, rgba(0,0,0,0.4) 100%);
  box-shadow: inset 0 0 60px rgba(0,0,0,0.5);
  border: 2px solid rgba(0,0,0,0.2);
  border-radius: 6px;
}

    
    #typed-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      font-family: "Courier New", monospace;
      font-size: 12vw;
      color: rgba(0, 255, 100, 0.05);
      white-space: pre-wrap;
      pointer-events: none;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 0.9;
      filter: blur(1px) contrast(1.2);
      animation: jitter 0.15s infinite alternate;
    }

    @keyframes jitter {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-1px, 1px); }
      50% { transform: translate(1px, -1px); }
      75% { transform: translate(-1px, 1px); }
      100% { transform: translate(0, 0); }
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.05),
        rgba(0,0,0,0.05) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 0;
    }

    #home, .page {
      max-width: 700px;
      position: relative;
      z-index: 2; 
    }

    .hidden { display: none; }

    h1, h2 {
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 1.5rem;
    }

    li { margin: 0.4rem 0; opacity: 0.9; }

    .hint { margin-top: 1.5rem; font-size: 0.9em; color: #666; }
  </style>
</head>
<body>

">
  <div class="tenor-gif-embed"
       data-postid="4920656752343349178"

       data-width="100%">
    <a href="https://tenor.com/view/honkai-star-rail-hsr-sparkle-hsr-sparkle-sparkle-honkai-star-rail-gif-4920656752343349178">

    </a> from 
    <a href="https://tenor.com/search/honkai+star+rail-gifs">Honkai Star Rail GIFs</a>
  </div>
</div>

<script async src="https://tenor.com/embed.js"></script>

  
<div id="hint-button" title="Clique pour voir les titres, echap pour effacer" style="
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 3;
  cursor: pointer;
  background: rgba(0,0,0,0.1);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 0.85em;
  font-family: sans-serif;
  color: #111;
  transition: 0.2s;
">💡</div>

<div id="hint-list" class="hidden" style="
  position: fixed;
  top: 40px;
  right: 10px;
  background: rgba(255,255,255,0.9);
  padding: 8px 12px;
  border-radius: 6px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  font-size: 0.85em;
  z-index: 3;
  max-width: 180px;
">
</div>

<div id="typed-background"></div>

<div id="home">
  <h1>Tadoniji</h1>
  <p class="hint">Recherchez un titre dans la discographie.</p><br>
  <p class="hint">ou tapez tadoniji pour vous laisser porter</p>
</div>

<div id="catalogue" class="page hidden">
  <h2>Catalogue</h2>
  <ul id="catalogue-list"></ul>
</div>

<div id="albums" class="page hidden">
  <h2>Albums</h2>
  <ul id="albums-list"></ul>
</div>

<div id="singles" class="page hidden">
  <h2>Singles</h2>
  <ul id="singles-list"></ul>
</div>

<div id="ep" class="page hidden">
  <h2>EP</h2>
  <ul id="ep-list"></ul>
</div>

<script>
let typed = "";
const typedBg = document.getElementById("typed-background");
const hiddenInput = document.getElementById("hidden-input");

// détecter mobile
const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

// focus automatique sur mobile
function focusInput() {
  hiddenInput.focus();
}
if(isMobile){
  window.addEventListener("load", focusInput);
  window.addEventListener("touchstart", focusInput);
}

// Pages
const pages = {
  home: document.getElementById("home"),
  catalogue: document.getElementById("catalogue"),
  albums: document.getElementById("albums"),
  singles: document.getElementById("singles"),
  ep: document.getElementById("ep")
};

// Discographie
const music = {
  albums: [
    { title: "Travel spirit", link: "" },
    { title: "Paradox", link: "https://ffm.to/b11cce5032a30ac6078d3f36500dcc57168eb88f930241ce" },
    { title: "Timefall", link: "https://ffm.to/469a9af3f9422bb1b250c39698d25116bcfdc1a919cea922" },
    { title: "Enemy", link: "https://ffm.to/486fca769cd12b65ca0fc23bc7d94c8888d20562c5482110" }
  ],
  singles: [
    { title: "Stand", link: "https://ffm.to/19f7445d0f4915364db050769f141a5a40d7665385beaeda" },
    { title: "The Voices", link: "https://ffm.to/2460fe01131c5d8685fbc109a5fedb8da89c892cf92de212" },
    { title: "Voidcall", link: "https://ffm.to/1be5058c46975b6e1e5cd585613ea770ca8dafe904681b73" },
    { title: "Fracture", link: "https://ffm.to/88f60aee43fd2894dc28b81633bf25f8363711b8c310dbdc" },
    { title: "Moonrise", link: "https://ffm.to/194c0893857f8572a1a1fbf4401635f025c3e5da250c7e5e" },
    { title: "Travel Spirit", link: "https://www.youtube.com/watch?v=r0TpHyHKxOs&list=OLAK5uy_nG4VKgFfc8YF4BbXzPLVpX5mpJZUld9E8" }
  ],
  ep: [
    { title: "Into the Dark", link: "https://ffm.to/65500a008ffda1382675a840ea3237d27a4088f55fb425f5" }
  ]
};

// hints
const hintButton = document.getElementById("hint-button");
const hintList = document.getElementById("hint-list");
const mainTitles = [...music.albums.map(a => a.title), ...music.singles.map(s => s.title)];

// bouton indice
hintButton.addEventListener("click", () => {
  if(hintList.classList.contains("hidden")) {
    hintList.innerHTML = mainTitles.join("<br>");
    hintList.classList.remove("hidden");
  } else {
    hintList.classList.add("hidden");
  }
});

// popup GIF erreur
function triggerErrorPopup() {
  const popup = document.getElementById("error-popup");
  popup.classList.remove("hidden");
  setTimeout(() => popup.classList.add("hidden"), 1000);
}

// longueur maximale des titres pour délai erreur
const maxTitleLength = Math.max(...[...music.albums, ...music.singles].map(i => i.title.length));

// mettre à jour le fond
function updateTypedBg() {
  typedBg.textContent = typed.toUpperCase();
}

// listes
function populate() {
  const catalogue = [];
  music.albums.forEach(a => catalogue.push(a.title));
  music.singles.forEach(s => catalogue.push(s.title));

  document.getElementById("catalogue-list").innerHTML = catalogue.map(t => `<li>${t}</li>`).join("");
  document.getElementById("albums-list").innerHTML = music.albums.map(a => `<li>${a.title}</li>`).join("");
  document.getElementById("singles-list").innerHTML = music.singles.map(s => `<li>${s.title}</li>`).join("");
  document.getElementById("ep-list").innerHTML = "<li>—</li>";
}
populate();

// fonctions pages
function show(page) {
  Object.values(pages).forEach(p => p.classList.add("hidden"));
  pages[page].classList.remove("hidden");
}

function reset() {
  typed = "";
  show("home");
  updateTypedBg();
}

// fonction unique pour gérer la saisie
function handleTyping(char) {
  typed += char.toLowerCase();
  typed = typed.slice(-40);
  updateTypedBg();

  // navigation pages
  Object.keys(pages).forEach(page => {
    if(typed.includes(page)) show(page);
  });

  // redirections titres
  [...music.albums, ...music.singles].forEach(item => {
    if(typed.includes(item.title.toLowerCase())) {
      window.open(item.link, "_blank");
      typed = "";
      updateTypedBg();
    }
  });

  // Tadoniji → titre aléatoire
  if(typed.includes("tadoniji")) {
    const randomIndex = Math.floor(Math.random() * mainTitles.length);
    const randomTitle = mainTitles[randomIndex];
    const item = [...music.albums, ...music.singles].find(i => i.title === randomTitle);
    if(item) window.open(item.link, "_blank");
    typed = "";
    updateTypedBg();
  }

  // popup erreur après maxTitleLength + 4 caractères si rien de valide
  const allTitles = [...music.albums, ...music.singles].map(i => i.title.toLowerCase());
  const validPages = Object.keys(pages);
  const isValid = allTitles.some(t => typed.includes(t)) || validPages.some(p => typed.includes(p)) || typed.includes("tadoniji");

  if(typed.length >= maxTitleLength + 4 && !isValid) {
    triggerErrorPopup();
  }
}

// listener desktop / mobile
if(isMobile){
  hiddenInput.addEventListener("input", (e) => {
    handleTyping(e.target.value);
    hiddenInput.value = ""; // vide le champ invisible
  });
} else {
  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape") { reset(); return; }
    if(e.key.length === 1) handleTyping(e.key);
  });
}
</script>


</body>
</html>
