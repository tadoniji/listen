<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Share Tech Mono"', 'monospace'],
            cyber: ['"Chakra Petch"', 'sans-serif'],
          },
          colors: {
            cyberNeon: '#00f3ff',
            cyberPink: '#ff0055',
            cyberGreen: '#00ff66',
            cyberYellow: '#ffe600',
            deckBg: '#090b10',
            deckSurface: '#121620',
          },
          boxShadow: {
            'neon-cyan': '0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 10px rgba(0, 243, 255, 0.2)',
            'neon-pink': '0 0 15px rgba(255, 0, 85, 0.4), inset 0 0 10px rgba(255, 0, 85, 0.2)',

  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-green: #00ff66;
    }

    body {
      background-color: #050608;
      background-image: 
        radial-gradient(circle at 50% 12%, rgba(0, 243, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 88%, rgba(255, 0, 85, 0.06) 0%, transparent 50%),
        linear-gradient(rgba(10, 14, 23, 0.95), rgba(6, 8, 12, 0.98));
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* Screen and CRT Scanlines */
    .crt-screen {
      position: relative;
      background: radial-gradient(circle at 50% 50%, #0e1a22 0%, #050a0d 100%);
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.95), 0 0 15px rgba(0, 243, 255, 0.25);
    }
    .crt-screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.65;
    }
    .crt-screen::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at 50% 50%, transparent 65%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 11;
    }

    .cyber-chassis {
      background: linear-gradient(150deg, #171d2b, #0c1017);
      box-shadow: 
        0 20px 40px -15px rgba(0,0,0,0.9),
        0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        inset 0 -2px 4px rgba(0,0,0,0.85);
    }

    .clip-corner-cut {
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    }
    .clip-screen {
      clip-path: polygon(0 8px, 8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px));
    }

    .glow-cyan {
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.7), 0 0 20px rgba(0, 243, 255, 0.3);
    }
    .glow-pink {
      text-shadow: 0 0 8px rgba(255, 0, 85, 0.7), 0 0 20px rgba(255, 0, 85, 0.3);
    }
    .glow-green {
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.7);
    }

    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin-active {
      animation: spinDisc 6s linear infinite;
    }
    .spin-paused {
      animation-play-state: paused;
    }

    /* Range Scrubber Style */
    input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 2px;
      background: #00f3ff;
      cursor: pointer;
      box-shadow: 0 0 6px #00f3ff;
    }
    input[type=range]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      background: #00f3ff;
      cursor: pointer;
      box-shadow: 0 0 6px #00f3ff;
    }
  </style>
</head>

    // Spectrum Bars

    // Web Audio Click & Frequency Analyzer
    let audioCtx = null;
    let analyser = null;
    let dataArray = null;
    let animFrameId = null;

    function initWebAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        try {
          const source = audioCtx.createMediaElementSource(audio);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          dataArray = new Uint8Array(analyser.frequencyBinCount);
        } catch (e) {
          analyser = null;
        }
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playMechanicalClick(pitch = 750) {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (err) {}
    }

    function updateVisualizer() {
      if (!isPlaying) {
        bars.forEach(b => b.style.height = "12%");
        return;
      }

      const track = filteredList[currentIndex];

      if (analyser && dataArray) {
        try {
          analyser.getByteFrequencyData(dataArray);
          for (let i = 0; i < 16; i++) {
            const val = dataArray[i * 2] || 0;
            const percent = Math.max(12, Math.min(100, (val / 255) * 100));
            bars[i].style.height = `${percent}%`;
            bars[i].style.backgroundColor = track.color;
          }
        } catch (e) {
          fallbackVisualizer(track);
        }
      } else {
        fallbackVisualizer(track);
      }

      animFrameId = requestAnimationFrame(updateVisualizer);
    }

    function fallbackVisualizer(track) {
      bars.forEach((b) => {
        const randVal = Math.floor(Math.random() * 65) + 20;
        b.style.height = `${randVal}%`;
        b.style.backgroundColor = track.color;
      });
    }

    /**
     * Recherche automatique de l'extrait audio et de la jaquette
     */
    async function resolveTrackMedia(track) {
      if (track.previewUrl && track.coverUrl) return;

      const query = encodeURIComponent(track.searchQuery);
      const url = `https://itunes.apple.com/search?term=${query}&entity=song&limit=1`;

      try {
        const response = await fetch(url);
        if (response.ok) {
          const data = await response.json();
          if (data.results && data.results.length > 0) {
            const item = data.results[0];
            if (item.previewUrl) {
              track.previewUrl = item.previewUrl;
            }
            if (item.artworkUrl100) {
              // Obtenir la résolution 600x600 HD
              track.coverUrl = item.artworkUrl100.replace("100x100bb", "600x600bb");
            }
          }
        }
      } catch (e) {
        console.warn("Recherche média iTunes non disponible, essai fallback Deezer...", e);
      }

      // Si toujours aucun média trouvé, on applique une jaquette SVG personnalisée
      if (!track.coverUrl) {
        track.hasCustomSvg = true;
      }
    }

    // Précharge tous les morceaux en arrière-plan
    async function preloadAllTracksMedia() {
      for (const track of DISCOGRAPHY) {
        resolveTrackMedia(track);
      }
    }

    function generateCoverSVG(variant, color) {
      switch (variant) {
        case "portal":
          return `
            <svg viewBox="0 0 200 200" class="w-full h-full">
              <rect width="200" height="200" fill="#04070c"/>
              <circle cx="100" cy="100" r="80" fill="${color}" fill-opacity="0.2"/>
              <circle cx="100" cy="100" r="65" stroke="${color}" stroke-width="2" stroke-dasharray="8 4" fill="none"/>
              <circle cx="100" cy="100" r="45" stroke="#fff" stroke-width="2" fill="none"/>
              <polygon points="100,50 145,130 55,130" stroke="${color}" stroke-width="2" fill="none"/>
            </svg>
          `;
        case "hourGlass":
          return `
            <svg viewBox="0 0 200 200" class="w-full h-full">
              <rect width="200" height="200" fill="#0c0408"/>

              <polygon points="100,100 150,160 50,160" fill="${color}" fill-opacity="0.5" stroke="${color}" stroke-width="2"/>
              <circle cx="100" cy="100" r="18" fill="none" stroke="#fff" stroke-width="2"/>
            </svg>
          `;
        case "glitchSkull":
          return `
            <svg viewBox="0 0 200 200" class="w-full h-full">

              <circle cx="80" cy="85" r="12" fill="${color}"/>
              <circle cx="120" cy="85" r="12" fill="${color}"/>
              <rect x="85" y="125" width="30" height="15" fill="none" stroke="${color}" stroke-width="1.5"/>
            </svg>
          `;
        case "horizon":
          return `
            <svg viewBox="0 0 200 200" class="w-full h-full">
              <rect width="200" height="200" fill="#0d0b03"/>
              <circle cx="100" cy="95" r="50" fill="${color}" fill-opacity="0.8"/>
              <line x1="0" y1="95" x2="200" y2="95" stroke="#000" stroke-width="4"/>
              <line x1="0" y1="105" x2="200" y2="105" stroke="#000" stroke-width="4"/>
              <line x1="0" y1="117" x2="200" y2="117" stroke="#000" stroke-width="4"/>
              <line x1="0" y1="132" x2="200" y2="132" stroke="#000" stroke-width="5"/>

          `;
        case "pillar":
          return `
            <svg viewBox="0 0 200 200" class="w-full h-full">
              <rect width="200" height="200" fill="#030c05"/>
              <rect x="85" y="30" width="30" height="140" fill="none" stroke="${color}" stroke-width="2"/>
              <line x1="70" y1="170" x2="130" y2="170" stroke="${color}" stroke-width="3"/>
              <circle cx="100" cy="100" r="40" stroke="${color}" stroke-width="1.5" stroke-dasharray="6 3" fill="none"/>
            </svg>
          `;
        case "frequencies":
          return `
            <svg viewBox="0 0 200 200" class="w-full h-full">
              <rect width="200" height="200" fill="#09030c"/>
              <path d="M20 100 Q60 20 100 100 T180 100" fill="none" stroke="${color}" stroke-width="2.5"/>
              <circle cx="100" cy="100" r="16" fill="${color}" fill-opacity="0.6"/>
            </svg>
          `;
        case "singularity":
          return `
            <svg viewBox="0 0 200 200" class="w-full h-full">
              <rect width="200" height="200" fill="#02080d"/>
              <circle cx="100" cy="100" r="6" fill="#fff"/>
              <circle cx="100" cy="100" r="30" stroke="${color}" stroke-width="2" fill="none"/>
              <circle cx="100" cy="100" r="60" stroke="${color}" stroke-width="1.5" stroke-dasharray="10 6" fill="none"/>
            </svg>
          `;
        case "crystalShard":
          return `
            <svg viewBox="0 0 200 200" class="w-full h-full">
              <rect width="200" height="200" fill="#0c0207"/>
              <polygon points="100,20 140,80 120,170 80,170 60,80" fill="none" stroke="${color}" stroke-width="2.5"/>
            </svg>
          `;
        case "neonMoon":
          return `
            <svg viewBox="0 0 200 200" class="w-full h-full">
              <rect width="200" height="200" fill="#02090f"/>
              <path d="M80 40 A50 50 0 1 0 140 140 A60 60 0 0 1 80 40 Z" fill="${color}" fill-opacity="0.3" stroke="${color}" stroke-width="2.5"/>
            </svg>
          `;
        case "eclipse":
        default:
          return `
            <svg viewBox="0 0 200 200" class="w-full h-full">
              <rect width="200" height="200" fill="#06020c"/>
              <circle cx="100" cy="100" r="60" fill="none" stroke="${color}" stroke-width="4"/>
              <circle cx="92" cy="95" r="54" fill="#06020c"/>
            </svg>
          `;
      }
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    async function updateTrackUI() {
      if (filteredList.length === 0) return;
      const track = filteredList[currentIndex];

      trackTitleEl.textContent = track.title.toUpperCase();
      formatBadgeEl.textContent = track.type;
      trackIndexEl.textContent = `TRACK ${String(currentIndex + 1).padStart(2, '0')}/${String(filteredList.length).padStart(2, '0')}`;

      // Si pas encore résolu, tenter de récupérer la pochette et l'audio
      if (!track.previewUrl && !track.hasCustomSvg) {
        audioStatusLed.textContent = "SYNCHRONISATION...";
        audioStatusLed.className = "px-2 py-0.5 rounded text-[10px] bg-cyan-950 text-cyan-300 border border-cyan-700 animate-pulse";
        await resolveTrackMedia(track);
      }

      // Gestion de la pochette officielle
      if (track.coverUrl) {
        coverImgEl.src = track.coverUrl;
        coverImgEl.classList.remove("hidden");
        artworkSvgEl.classList.add("hidden");
      } else {
        coverImgEl.classList.add("hidden");
        artworkSvgEl.classList.remove("hidden");
        artworkSvgEl.innerHTML = generateCoverSVG(track.svgVariant, track.color);
      }

      discWheelEl.style.borderColor = track.color;
      discAuraEl.style.backgroundColor = track.color + "25";
      discWheelEl.style.boxShadow = `0 0 20px ${track.color}66`;
      discSpindleDot.style.backgroundColor = track.color;

      // Bouton streaming
      if (track.link && track.link.trim() !== "") {
        streamLinkBtn.href = track.link;
        streamLinkBtn.classList.remove("opacity-50", "pointer-events-none");
        const isYt = track.link.includes("youtube");
        streamPlatformBadge.textContent = isYt ? "YOUTUBE ↗" : "FFM.TO ↗";
        streamBtnText.textContent = "ÉCOUTER EN ENTIER";
      } else {
        streamLinkBtn.removeAttribute("href");
        streamLinkBtn.classList.add("opacity-50", "pointer-events-none");
        streamBtnText.textContent = "LIEN NON DISPONIBLE";
      }

      // Bouton extrait
      if (track.previewUrl) {
        btnPreview.classList.remove("opacity-50", "pointer-events-none");
        previewBtnLabel.textContent = isPlaying ? "PAUSE EXTRAIT" : "ÉCOUTER EXTRAIT (30s)";
        audioStatusLed.textContent = isPlaying ? "LECTURE: 30s" : "EXTRAIT PRÊT";
        audioStatusLed.className = "px-2 py-0.5 rounded text-[10px] bg-cyan-950 text-cyberNeon border border-cyberNeon";
      } else {
        previewBtnLabel.textContent = "CHARGEMENT EXTRAIT...";
        audioStatusLed.textContent = "EN ATTENTE";
      }

      document.querySelectorAll(".quick-item").forEach(item => {
        if (item.dataset.id === track.id) {
          item.classList.add("border-cyberNeon", "bg-cyan-950/60", "text-cyberNeon");
        } else {
          item.classList.remove("border-cyberNeon", "bg-cyan-950/60", "text-cyberNeon");
        }
      });
    }

    async function loadTrack(track, autoPlay = false) {
      audio.pause();
      audio.currentTime = 0;
      audioSeek.value = 0;
      timeDisplayEl.textContent = "00:00 / 00:30";

      await updateTrackUI();

      if (track.previewUrl) {
        audio.src = track.previewUrl;
        audio.load();
        if (autoPlay) {
          playAudio();
        } else {
          stopAudioUI();
        }
      } else {
        audio.removeAttribute("src");
        stopAudioUI();
      }
    }

    function playAudio() {
      const track = filteredList[currentIndex];
      if (!track.previewUrl) {
        // En cas de délai réseau, on tente une dernière fois
        resolveTrackMedia(track).then(() => {
          if (track.previewUrl) {
            audio.src = track.previewUrl;
            audio.play().then(onPlaySuccess).catch(stopAudioUI);
          }
        });
        return;
      }

      initWebAudio();
      audio.play().then(onPlaySuccess).catch(err => {
        console.warn("Lecture bloquée : interaction nécessaire", err);
        stopAudioUI();
      });
    }

    function onPlaySuccess() {
      isPlaying = true;
      discWheelEl.classList.add("spin-active");
      discWheelEl.classList.remove("spin-paused");
      previewIndicatorEl.classList.remove("opacity-40");
      previewIndicatorEl.classList.add("text-cyberGreen", "animate-pulse");
      previewBtnLabel.textContent = "PAUSE EXTRAIT";
      previewBtnIcon.className = "w-3.5 h-3.5 rounded bg-cyberPink shadow-[0_0_6px_#ff0055]";
      audioStatusLed.textContent = "LECTURE: 30s";
      audioStatusLed.className = "px-2 py-0.5 rounded text-[10px] bg-cyan-950 text-cyberNeon border border-cyberNeon";
      cancelAnimationFrame(animFrameId);
      updateVisualizer();
    }

    function pauseAudio() {
      audio.pause();
      stopAudioUI();
    }

    function stopAudioUI() {
      isPlaying = false;
      discWheelEl.classList.add("spin-paused");
      previewIndicatorEl.classList.add("opacity-40");
      previewIndicatorEl.classList.remove("text-cyberGreen", "animate-pulse");
      previewBtnLabel.textContent = "ÉCOUTER EXTRAIT (30s)";
      previewBtnIcon.className = "w-3.5 h-3.5 rounded-full bg-cyberNeon shadow-[0_0_6px_#00f3ff]";
      audioStatusLed.textContent = "EN PAUSE";
      audioStatusLed.className = "px-2 py-0.5 rounded text-[10px] bg-slate-800 text-slate-400 border border-slate-700";
      cancelAnimationFrame(animFrameId);
      bars.forEach(b => b.style.height = "12%");
    }

    function togglePlay() {
      playMechanicalClick(900);
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    // Audio Event Listeners
    audio.addEventListener("timeupdate", () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        const percent = (audio.currentTime / audio.duration) * 100;
        audioSeek.value = percent;
        timeDisplayEl.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
      }
    });

    audio.addEventListener("ended", () => {
      stopAudioUI();
      audioSeek.value = 0;
    });

    audio.addEventListener("loadedmetadata", () => {
      timeDisplayEl.textContent = `00:00 / ${formatTime(audio.duration)}`;
    });

    // Seek scrubber interaction
    audioSeek.addEventListener("input", (e) => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        const seekTo = (e.target.value / 100) * audio.duration;
        audio.currentTime = seekTo;
      }
    });

    function changeTrack(direction) {
      playMechanicalClick(650);
      const wasPlaying = isPlaying;
      if (direction === 'next') {
        currentIndex = (currentIndex + 1) % filteredList.length;
      } else {
        currentIndex = (currentIndex - 1 + filteredList.length) % filteredList.length;
      }
      loadTrack(filteredList[currentIndex], wasPlaying);
    }

    function setFilter(cat) {
      playMechanicalClick(750);
      document.querySelectorAll(".cat-btn").forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = "cat-btn active py-2 rounded-lg bg-cyan-500/20 text-cyberNeon border border-cyan-400 font-bold transition-all shadow-[0_0_8px_rgba(0,243,255,0.3)]";
        } else {
          btn.className = "cat-btn py-2 rounded-lg bg-slate-900/80 text-slate-400 border border-slate-700 font-bold hover:text-white transition-all";
        }
      });

      filteredList = cat === "all" ? [...DISCOGRAPHY] : DISCOGRAPHY.filter(item => item.cat === cat);
      currentIndex = 0;
      loadTrack(filteredList[currentIndex], false);
      renderQuickList();
    }

    function renderQuickList() {
      quickListContainer.innerHTML = "";
      totalBadgeEl.textContent = filteredList.length;
      filteredList.forEach((track, idx) => {
        const itemBtn = document.createElement("button");
        itemBtn.dataset.id = track.id;
        itemBtn.className = `quick-item text-left p-2 rounded border border-slate-800 hover:border-slate-600 flex items-center justify-between transition-colors ${idx === currentIndex ? "border-cyberNeon bg-cyan-950/60 text-cyberNeon" : ""}`;
        itemBtn.innerHTML = `
          <span class="truncate pr-1"><span class="text-slate-600 mr-1.5">${String(idx + 1).padStart(2, '0')}.</span>${track.title}</span>
          <span class="text-[9px] px-1 py-0.2 rounded bg-slate-800 text-slate-400">${track.type}</span>
        `;
        itemBtn.addEventListener("click", () => {
          playMechanicalClick(650);
          currentIndex = idx;
          loadTrack(filteredList[currentIndex], true);
        });
        quickListContainer.appendChild(itemBtn);
      });
    }

    // Hardware Controls
    document.getElementById("btn-prev").addEventListener("click", () => changeTrack('prev'));
    document.getElementById("btn-next").addEventListener("click", () => changeTrack('next'));
    btnPreview.addEventListener("click", togglePlay);

    // Random Easter Egg
    function triggerRandomDive() {
      playMechanicalClick(1100);
      const randIdx = Math.floor(Math.random() * filteredList.length);
      currentIndex = randIdx;
      loadTrack(filteredList[currentIndex], isPlaying);
    }
    document.getElementById("btn-random").addEventListener("click", triggerRandomDive);

    // Filter Buttons
    document.querySelectorAll(".cat-btn").forEach(btn => {
      btn.addEventListener("click", () => setFilter(btn.dataset.cat));
    });

    // Touch Swipe Gestures on Art Container for Mobile
    const artContainer = document.getElementById("art-container");
    let touchStartX = 0;
    let touchEndX = 0;

    artContainer.addEventListener("click", togglePlay);

    artContainer.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    artContainer.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      const swipeDistance = touchEndX - touchStartX;
      if (Math.abs(swipeDistance) > 40) {
        if (swipeDistance > 0) {
          changeTrack('prev');
        } else {
          changeTrack('next');
        }
      }
    }, { passive: true });

    // Terminal Keyboard Search & "tadoniji" easter egg
    terminalInput.addEventListener("input", (e) => {
      const val = e.target.value.toLowerCase().trim();
      if (val.includes("tadoniji")) {
        terminalInput.value = "";
        triggerRandomDive();
        return;
      }

      const foundIdx = filteredList.findIndex(t => t.title.toLowerCase().includes(val));
      if (foundIdx !== -1 && val.length >= 3) {
        currentIndex = foundIdx;
        loadTrack(filteredList[currentIndex], false);
      }
    });

    // Keyboard Shortcuts
    window.addEventListener("keydown", (e) => {
      if (document.activeElement === terminalInput) return;
      if (e.key === "ArrowLeft") changeTrack('prev');
      if (e.key === "ArrowRight") changeTrack('next');
      if (e.key === " ") {
        e.preventDefault();
        togglePlay();
      }
    });

    // Boot
    preloadAllTracksMedia();
    loadTrack(filteredList[currentIndex], false);
    renderQuickList();
  </script>
</body>
</html>
